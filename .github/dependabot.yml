version: 2
# `cooldown` holds back a VERSION update until the release is 14 days old. Dependabot deliberately
# does NOT apply it to a SECURITY update: an advisory fix ships as soon as it is published. The CI
# gate that mirrors this setting (scripts/check_dependency_cooldown.py) exempts security updates for
# the same reason - see "dependency-cooldown EXEMPTS a security update" in AGENTS.md.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/plugins/commentable-html/dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      dev-deps:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/site/tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      site-test-deps:
        patterns: ["*"]
