name: pwsh-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pwsh-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pinned plugin CLIs
        run: npm install --global @github/copilot@1.0.83 @anthropic-ai/claude-code@2.1.251
      - name: Run auto-updater hook tests
        shell: pwsh
        run: pwsh -NoProfile -File plugins/urikan-ai-marketplace-auto-updater/dev/tests/updater.Tests.ps1
      - name: Run real-CLI updater lifecycle
        run: python plugins/urikan-ai-marketplace-auto-updater/dev/tests/real_cli_lifecycle.py
      - name: Run auto-updater hook tests on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File plugins/urikan-ai-marketplace-auto-updater/dev/tests/updater.Tests.ps1
      - name: Run watch-pr-github decision-logic tests
        shell: pwsh
        run: pwsh -NoProfile -File .github/skills/watch-pr-github/tests/decision.Tests.ps1
